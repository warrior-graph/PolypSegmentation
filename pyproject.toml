[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "polypseg"
version = "0.1.0"
description = "Segmentação assistida de pólipos com superpixels e descritores de textura"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-image>=0.24",
    "scikit-learn>=1.5",
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
data = ["huggingface_hub>=0.24", "remotezip>=0.12"]
xgb = ["xgboost>=2.0"]

[project.scripts]
polypseg-gui = "polypseg.gui.app:main"
polypseg-eval = "polypseg.evaluation:main"

[tool.hatch.build.targets.wheel]
packages = ["src/polypseg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
